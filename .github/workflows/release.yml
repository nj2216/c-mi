name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Static Package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building release for tag ${TAG} (version ${VER})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static image with Docker Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolchain/Dockerfile
          load: true
          tags: c-mi-static:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract static binary and verify
        run: |
          container=$(docker create c-mi-static:latest)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p build-static
          docker cp "$container:/c-mi" build-static/c-mi
          chmod +x build-static/c-mi

          # Verify that Qt and FFmpeg are statically linked
          file build-static/c-mi | grep -F 'ELF'
          if ldd build-static/c-mi 2>&1 | grep -Ei 'qt6|libav|libsw'; then
            echo "error: static binary still depends on Qt/FFmpeg shared libraries" >&2
            exit 1
          fi

      - name: Package release tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}" \
          BINARY=build-static/c-mi \
          ./toolchain/package.sh

      - name: Ensure install.sh is present and executable
        run: |
          chmod +x install.sh
          ls -la dist/ install.sh

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: c~mi ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

